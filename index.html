<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 30 - JavaScript 05</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #ketqua {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>BÀI TẬP 30</h2>
        <h3>Tính tổng các số chia hết cho 3</h3>

        <form onsubmit="handleSubmit(event)">
            <p>Nhập số đầu:</p>
            <input type="number" id="sodau" required>

            <p>Nhập số cuối:</p>
            <input type="number" id="socuoi" required>

            <br>
            <button type="submit">Tính tổng</button>
        </form>

        <p id="ketqua">Kết quả sẽ hiển thị ở đây</p>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const sodau = Number(document.getElementById("sodau").value);
            const socuoi = Number(document.getElementById("socuoi").value);

            if (sodau > socuoi) {
                document.getElementById("ketqua").innerText =
                    "Số đầu phải nhỏ hơn hoặc bằng số cuối!";
                return;
            }

            let tong = 0;

            for (let i = sodau; i <= socuoi; i++) {
                if (i % 3 === 0) {
                    tong += i;
                }
            }

            document.getElementById("ketqua").innerText =
                "Tổng các số chia hết cho 3 là: " + tong;
        }
    </script>
</body>
</html>
